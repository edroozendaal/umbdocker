services:
  umbdocker:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_CONFIGURATION: Release
    image: umbdocker:local
    container_name: umbdocker-dev
    ports:
      - "5000:8080"
    volumes:
      # Persistent Umbraco data
      - ./umbraco/Data:/app/umbraco/Data
      - ./umbraco/Logs:/app/umbraco/Logs
      - ./umbraco/Models:/app/umbraco/Models
      # Media files
      - ./umbraco/media:/app/wwwroot/media
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Development}
      # Secret for signing image resize URLs; set in .env (never commit)
      - Umbraco__CMS__Imaging__HMACSecretKey=${IMAGING_HMAC_SECRET:-}
      - ASPNETCORE_URLS=http://+:8080
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - umbdocker-network

networks:
  umbdocker-network:
    driver: bridge
